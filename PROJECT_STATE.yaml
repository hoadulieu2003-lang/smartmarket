schema_version: "1.0"
project:
  name: "Smart Market — Chợ Thông Minh"
  objective: "Xây dựng Web CMS Trung tâm Điều hành Tác chiến (Operational Command Center) dành cho Ban Quản Lý Chợ, tích hợp sơ đồ mặt bằng tương tác 2D SVG / 2.5D dựa trên Canonical Spatial Model 3.2.0"
deliverable:
  type: "product_web_cms"
  description: "Thiết kế hệ thống UX/UI, Design System và triển khai Web CMS Quản lý Chợ trên Tech Stack mới (Next.js 16, Tailwind CSS v4, shadcn/ui + Base UI, Motion for React, SVG 2D, Three.js/R3F, Storybook, Playwright), khởi đầu với Phase 3B.2.1 — Stall Visual Language."
phase:
  current: "delivery"
  status: "completed"
baseline:
  identifier: "canonical-spatial-v3.2.0"
  frozen: true
current_state:
  evidence:
    - path: "c:/Users/game/Documents/app/Chợ thông minh uiux/src/spatial/SPATIAL_ARCHITECTURE.md"
      description: "Canonical Spatial Architecture v3.2.0, hệ tọa độ (top_left, X+ East, Y+ South, metric_cm, scale 0.1m) và 9 thực thể không gian."
    - path: "c:/Users/game/Documents/app/Chợ thông minh uiux/src/spatial/types.ts"
      description: "Định nghĩa Typescript của 9 thực thể Canonical Spatial Model và Generic Operational Issue Engine."
    - path: "c:/Users/game/Documents/app/Chợ thông minh uiux/src/spatial/renderer/stallVisualAdapter.ts"
      description: "Bản prototype sơ khởi ánh xạ dữ liệu nghiệp vụ sạp sang visual tokens."
    - path: "c:/Users/game/Documents/app/Chợ thông minh uiux/src/spatial/renderer/SvgSpatialRenderer.jsx"
      description: "Generic 2D SVG Renderer đã được chứng minh độc lập qua 3 bộ fixture mặt bằng A, B, C."
    - path: "c:/Users/game/Documents/app/Chợ thông minh uiux/src/spatial/runSanityCheck.js"
      description: "Bộ kiểm thử 5 ca sanity check xác thực tính toàn vẹn dữ liệu không gian đạt 100%."
scope:
  in:
    - "Phase 3B.2.1: Chuẩn hóa Stall Visual Language (ngôn ngữ thị giác 1 đơn vị sạp) qua 7 trạng thái: Normal, Complaint, Expiring, Multi-status, Maintenance, Empty, Selected."
    - "Thiết lập Tech Stack mới: Next.js 16 (App Router), Tailwind CSS v4 (@theme CSS-first), Storybook, Playwright, Motion for React."
    - "Tách rời tuyệt đối Canonical Data (chỉ chứa hình học + nghiệp vụ) và Presentation Layer (Visual Tokens)."
    - "Xây dựng StallGlyph primitive SVG đa lớp và bộ Stall Visual Adapter chuẩn hóa quy tắc ưu tiên (P0 > P1 > P2 > P3)."
    - "Storybook State Matrix thẩm định trực quan cô lập 7 trạng thái."
    - "Playwright E2E & visual regression tests cho tương tác chọn sạp và focus bàn phím."
  out:
    - "Redesign hoặc thay đổi Application Shell đã khóa (Sidebar, Header, Priority Area, Side Panel drawer, Search/Filter)."
    - "Reskin toàn bộ bản đồ chợ (toàn map) hoặc các entity khác ngoài Stall trong phase này."
    - "Dựng 3D / Three.js / React Three Fiber trong Phase 3B.2.1 (chỉ chuẩn bị schema tương thích cho phase sau)."
    - "Quay lại dùng CSS Grid hard-code hoặc gắn vị trí layout cố định vào JSX."
    - "Nhồi thuộc tính CSS, mã màu hex hay style vào Canonical Spatial Model hoặc Fixtures."
    - "Các tính năng Mini App dành cho Tiểu thương và Người dân."
consumers:
  - role: "Ban Quản Lý Chợ (Trực ban, Trưởng BQL)"
    jobs_to_be_done: "Nắm bắt tức thì các sự cố khẩn cấp (phản ánh, cống rác, PCCC), định vị nhanh vị trí sạp trên mặt bằng để điều phối xử lý trong ca trực."
    frequency: "Hàng ngày, liên tục trong ca trực."
    urgency: "P0 (Khẩn cấp khi có phản ánh/sự cố hạ tầng)."
    failure_impact: "Xử lý chậm trễ khiếu nại của tiểu thương/người dân, nguy cơ mất an toàn hạ tầng và PCCC."
  - role: "Lead Architect / Product Owner (Anh)"
    jobs_to_be_done: "Duyệt thiết kế UX/UI, thẩm định tính chuẩn mực của Design DNA (Calm, Spatial, Operational, Precise, Trustworthy, Distinctive) và kiểm soát kiến trúc."
capabilities:
  - id: "CAP-01"
    name: "Operational Command Center Home"
    description: "Trang chủ tác chiến trả lời 5 câu hỏi vận hành với 4 tầng visual weight phân cấp rõ rệt."
  - id: "CAP-02"
    name: "Canonical Spatial Mapping"
    description: "Biểu diễn mặt bằng chợ dựa trên hệ tọa độ chuẩn xác thực địa, không phụ thuộc layout DOM."
  - id: "CAP-03"
    name: "Stall Visual Multi-Status Engine"
    description: "Hiển thị sạp đa sự cố theo thứ tự ưu tiên xác định (P0 Complaint thắng thế, P2 Expiring hiển thị dạng badge phụ, không xé nửa màu)."
  - id: "CAP-04"
    name: "Spatial Navigation & Progressive Disclosure"
    description: "Tìm kiếm điều hướng, lọc giữ bối cảnh không gian (Context Preservation) và mở Side Panel chi tiết khi tương tác."
contracts:
  inputs:
    - "Canonical Spatial Document v3.2.0 (Floors, Zones, Stalls, Aisles, Gates, Facilities, Infrastructures, Incidents)"
    - "OperationalIssue[] (generic issue engine)"
  outputs:
    - "StallVisualTokens (presentation-only contracts: fill, stroke, pattern, badge marker, visual weight, focus ring)"
    - "StallGlyph SVG Elements"
  interfaces:
    - "deriveStallVisual(stall: CanonicalStall, interaction: { selected: boolean }): StallVisualDescriptor"
    - "projectBoundsToSvg(boundsCm: CanonicalBoundsCm, viewport: SpatialViewport): SvgBounds"
dependencies:
  - name: "Next.js"
    version: "16.x"
  - name: "Tailwind CSS"
    version: "4.x"
  - name: "Storybook"
    version: "^8.x"
  - name: "Playwright"
    version: "^1.x"
  - name: "Motion for React"
    version: "latest"
constraints:
  - "Tuân thủ triệt để 'Quiet by Default' (quai-ợt bai đi-phôn) và 'Layers, Not Cards' (lây-ờz, nọt cạt)."
  - "Chỉ sử dụng Monospace font cho mã sạp, mã kỹ thuật và timestamp; không biến UI thành hacker console."
  - "Màu Smart Market Green (#076C31) chỉ dùng cho Brand, Navigation và Selected Focus; không dùng cho trạng thái cảnh báo."
  - "Mọi quyết định thiết kế phải giải thích rõ nguyên lý 'Tại sao?' và format thuật ngữ English (phát âm) = nghĩa tiếng Việt cho PO."
acceptance_criteria:
  - "AC-01: Canonical Spatial Data và Fixtures được bảo toàn 100% nguyên nghĩa từ v3.2.0, không chứa style CSS hay mã màu."
  - "AC-02: Stall Visual Adapter xử lý chuẩn xác 7 trạng thái với unit tests chứng minh tính xác định (deterministic) và bất biến (immutable input)."
  - "AC-03: Sạp có nhiều sự cố (Multi-status) hiển thị Primary Badge theo sự cố cao nhất và Secondary Badge nhỏ hơn, tuyệt đối không chia card nửa nọ nửa kia."
  - "AC-04: Trạng thái Selected sử dụng vòng focus green #076C31 tách biệt, không làm mất hoặc thay đổi trạng thái nghiệp vụ của sạp."
  - "AC-05: Toàn bộ 7 trạng thái và các ca kết hợp được trực quan hóa trên Storybook State Matrix để PO thẩm định trực tiếp."
  - "AC-06: Bộ test Playwright kiểm thử thành công tương tác click, keyboard navigation (Enter/Space), và chụp visual regression baseline ổn định."
  - "AC-07: Application Shell (Sidebar, Header, Priority Area, Side Panel) giữ nguyên bố cục và tương tác đã khóa."
assumptions:
  - "Workspace Smartmarket bắt đầu sạch và sẽ được scaffold chuẩn theo cấu trúc Next.js 16 + Tailwind v4 + Storybook + Playwright."
  - "Các file từ Chợ thông minh uiux là source of truth cho Canonical Spatial Model 3.2.0 và sẽ được porting nguyên vẹn sang Smartmarket."
risks:
  - id: "RSK-01"
    description: "Tailwind CSS v4 engine mới có thể gây khác biệt trong việc nạp dynamic class cho visual adapter."
    mitigation: "Sử dụng bảng ánh xạ semantic tokens tĩnh và CSS variables, không ghép chuỗi class động."
  - id: "RSK-02"
    description: "Visual weight của trạng thái bình thường (Normal) quá đậm gây nhiễu toàn sơ đồ."
    mitigation: "Áp dụng nghiêm ngặt Quiet by Default: nền slate-50/trắng, viền slate-200 mảnh, không badge hoạt động."
decisions:
  - id: "DEC-01"
    decision: "Khóa toàn bộ Application Shell và Priority Hierarchy; không redesign."
    rationale: "Đã qua thẩm định và chốt UX; trang chủ là Operational Command Center, không phải dashboard thông thường."
  - id: "DEC-02"
    decision: "Phạm vi Phase 3B.2.1 cô lập ở 1 Stall Spatial Unit trước khi nhân rộng ra toàn map."
    rationale: "Nguyên tắc 'Chốt vấn đề -> Học UI/UX -> Prototype nhỏ -> Review -> Chốt -> Mới nhân rộng'."
work_packages:
  - wp_id: "WP01"
    name: "Foundation Scaffold & Canonical Model Porting"
    target: "Setup Next.js 16, Tailwind v4, Storybook, Playwright; port canonical types & validator 3.2.0"
    status: "completed"
    evidence: "src/spatial/model/validator.test.ts (6/6 tests passed, Canonical 3.2.0 & Fixtures A/B/C valid 100%)"
  - wp_id: "WP02"
    name: "Stall Visual Adapter & Token System"
    target: "TDD bộ adapter pure function ánh xạ canonical issues sang presentation tokens"
    status: "completed"
    evidence: "src/spatial/presentation/stallVisualAdapter.test.ts (9/9 tests passed, 7 states, multi-status, immutability)"
  - wp_id: "WP03"
    name: "Primitive StallGlyph SVG Component"
    target: "Triển khai component SVG đa lớp, accessible và responsive theo coordinate projector"
    status: "completed"
    evidence: "src/spatial/renderer/StallGlyph.test.tsx (5/5 tests passed) & SvgSpatialRenderer.test.tsx (3/3 tests passed)"
  - wp_id: "WP04"
    name: "Storybook Matrix & Playwright UX Verification"
    target: "Thiết lập Storybook review matrix 7 trạng thái và automated Playwright tests"
    status: "completed"
    evidence: "StallGlyph.stories.tsx created, e2e/stall-visual-language.spec.ts created, Next.js 16 build passing 100%"
  - wp_id: "WP05"
    name: "Architectural Spatial Blueprint Overhaul (160 Stalls, 5 Zones, Visual Focus)"
    target: "Mở rộng sơ đồ không gian từ 8 lên 160 sạp hàng theo 5 phân khu chức năng, hệ thống lối đi đại lộ, nón quét camera CCTV, hiệu ứng Visual Focus (Dim & Highlight), đồng bộ Three.js 3D và dữ liệu kiểm thử thực tế"
    status: "completed"
    evidence: "src/data/megaMarketData.ts, SvgSpatialRenderer.tsx, validator.test.ts (24/24 tests passed), Next.js 16 build (0 errors), Browser subagent recorded 5 scenarios"
  - wp_id: "WP06"
    name: "In-Map Operations & Visual Task Optimization"
    target: "Triển khai hệ thống nhận diện vấn đề và công việc trực tiếp trên sơ đồ (In-Map Operational Engine): Biểu tượng sự cố đặc thù (💧, 🔥, 🛑, ⚖️, ⏳), Floating Action Pills đếm lùi SLA, Pulsing Sonar Beacons cho P0, Bảng tác chiến 1-chạm (InMapQuickActionCard), cập nhật trạng thái thời gian thực và Thanh chuyển đổi góc nhìn theo Ca trực (Duty Views)"
    status: "completed"
  - wp_id: "WP07"
    name: "Phase 2 — Three-Tier Operational Wireframe Implementation"
    target: "Triển khai trọn vẹn mô hình Wireframe 3 cấp: Màn 1 (Toàn chợ với huy hiệu sự cố gộp phân khu và sạp quiet by default), Màn 2 (Chi tiết khu với thanh điều hướng Breadcrumb, ô sạp lớn hơn và bộ lọc nội bộ 5 trạng thái), Màn 3 (Chi tiết sạp qua Right Panel với đầy đủ 8 khối thông tin nghiệp vụ, Live CCTV, SLA timer và cụm nút action to rõ). Đáp ứng 100% tiêu chí Acceptance Gate."
    status: "completed"
    evidence: "StallDetailDrawer.tsx, MapToolbar.tsx, SvgSpatialRenderer.tsx, page.tsx, Vitest 24/24 tests passed, Next.js build 0 errors, Browser Subagent recorded 4 scenarios"
  - wp_id: "WP08"
    name: "Phase 3 — Map Level of Detail (LOD) & Bi-directional Sync"
    target: "Triển khai kỹ thuật hạt nhân Map LOD 3 cấp (OVERVIEW, ZONE_FOCUS, STALL_SELECTED), hit-target touch WCAG >= 44x44px, typography chuẩn hóa 12.5-13.5px bold, cơ chế kéo thả tự do (Free Pan & Drag Engine), nút căn giữa trung tâm (Center Reset), outer focus halo ring xanh #076C31, và đồng bộ 2 chiều (Bi-directional Sync) giữa danh sách sự cố và sơ đồ không gian."
    status: "completed"
    evidence: "StallGlyph.tsx, SvgSpatialRenderer.tsx, UrgentActionCards.tsx, page.tsx, Vitest 24/24 tests passed, Next.js 16 build 0 errors, Jetski Browser subagent recorded 5 scenarios and verified all Gate criteria"
  - wp_id: "WP10"
    name: "Phase 5 — Decision Panel và Toolbar"
    target: "Tái cấu trúc Right Decision Panel thành đúng 6 khối chuẩn hóa (340-380px), cụm Dynamic Primary Actions >= 44px; Rút gọn Toolbar tối đa 2 hàng, gộp 4 lớp vào menu popover Lớp bản đồ, đưa 3D thành nút phụ kín đáo và tích hợp ô tìm kiếm trực tiếp."
    status: "completed"
    evidence: "StallDetailDrawer.tsx, MapToolbar.tsx, StallDetailDrawer.test.tsx (37/37 tests passed), Next.js 16 build 0 errors, Browser subagent recorded 4 screenshots + 1 video WebP"
  - wp_id: "WP11"
    name: "Phase — Optimize Map Display Flow for Larger Stall Units"
    target: "Tối ưu hóa display flow và mật độ canvas: Tăng kích thước sạp Khu A/B lên 90x72 (+83.2%), Khu C/D/E lên 58x82 (+116.2%), diện tích hữu ích tăng từ 29.6% lên 58.9%; Typography linh hoạt đạt 14.5-16px font-mono; Badge ưu tiên co giãn an toàn không tràn viền; Tích hợp nút bấm chuyển đổi đối chiếu Before (Sơ Đồ Cũ) vs After (Sạp Lớn +80%) trực tiếp trên Toolbar."
    status: "completed"
    evidence: "src/data/megaMarketData.ts, src/spatial/renderer/StallGlyph.tsx, src/spatial/renderer/SvgSpatialRenderer.tsx, src/components/MapToolbar.tsx, src/app/page.tsx, src/spatial/model/densityMode.test.ts (43/43 tests passed), Next.js 16 build 0 errors, Browser subagent recorded 5 screenshots + 1 video WebP, reviewed by cx/gpt-5.6-terra"
phase_verdict: "READY_FOR_VERIFICATION"
next_action: "Báo cáo Anh (Lead Architect / PO) nghiệm thu giai đoạn Tối ưu hóa Luồng Hiển thị Sạp Lớn (Optimize Map Display Flow for Larger Stall Units)."
