                endDate: { type: string, nullable: true, example: '2028-08-01' }
                fee: { type: integer, example: 2000000 }
                categoryId: { type: string, format: uuid, nullable: true }
                note: { type: string, nullable: true }
                renewFromContractId: { type: string, format: uuid, nullable: true }
