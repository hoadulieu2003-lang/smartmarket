                prefix: { type: string, example: A }
                startNumber: { type: integer, example: 1 }
                count: { type: integer, maximum: 200, example: 12 }
                digits: { type: integer, default: 2 }
                separator: { type: string, default: '-' }
                defaults:
                  type: object
                  properties:
                    acreage: { type: number, nullable: true }
                    categoryId: { type: string, format: uuid, nullable: true }
                    status: { type: string, enum: [vacant, maintenance, reserved], default: vacant }
