  # ================= ADMIN - SETTINGS & USERS =================
  /admin/settings:
    get:
      tags: [Admin - Settings & Users]
      summary: Toàn bộ cấu hình (SA)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/settings/{key}:
    get:
      tags: [Admin - Settings & Users]
      summary: Đọc 1 cấu hình theo key
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, example: product_units } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
    put:
      tags: [Admin - Settings & Users]
      summary: Cập nhật cấu hình (SA) — upsert theo key
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { description: 'JSON bất kỳ: number/array/object' }
                description: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/users:
    get:
      tags: [Admin - Settings & Users]
      summary: Tìm người dùng và tài khoản quản trị (SA toàn hệ thống; PA tìm user hoặc xem MM trong tỉnh)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [super_admin, province_admin, market_manager, user] } }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Admin - Settings & Users]
      summary: Tạo tài khoản PA/MM (SA)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, fullName, password]
              properties:
                role: { type: string, enum: [province_admin, market_manager] }
                fullName: { type: string }
                email: { type: string }
                phone: { type: string }
                password: { type: string, minLength: 8 }
                provinceId: { type: string, format: uuid, description: Bắt buộc với province_admin }
                marketIds: { type: array, items: { type: string, format: uuid }, description: Chợ gán cho market_manager }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /admin/users/{id}:
    put:
      tags: [Admin - Settings & Users]
      summary: Sửa tài khoản quản trị (SA)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                email: { type: string }
                phone: { type: string }
                provinceId: { type: string, format: uuid }
                marketIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /admin/users/{id}/status:
    patch:
      tags: [Admin - Settings & Users]
      summary: Khóa/mở tài khoản (SA)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /admin/users/{id}/reset-password:
    post:
      tags: [Admin - Settings & Users]
      summary: Đặt lại mật khẩu (SA)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/users/{id}/role:
    patch:
      tags: [Admin - Settings & Users]
      summary: Cấp, đổi hoặc gỡ quyền quản trị cho người dùng
      description: Super Admin thao tác toàn hệ thống. Cấp tỉnh chỉ được cấp/gỡ quyền market_manager và chỉ được gán các chợ thuộc tỉnh mình.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [province_admin, market_manager, user] }
                provinceId: { type: string, format: uuid }
                marketIds: { type: array, items: { type: string, format: uuid } }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /admin/provinces:
    get:
      tags: [Admin - Settings & Users]
      summary: Danh sách tỉnh (kèm số chợ)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Admin - Settings & Users]
      summary: Tạo tỉnh (SA)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /admin/provinces/{id}:
    put:
      tags: [Admin - Settings & Users]
      summary: Sửa tỉnh (SA)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [Admin - Settings & Users]
      summary: Xóa tỉnh chưa dùng (SA)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
