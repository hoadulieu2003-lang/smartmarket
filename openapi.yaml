openapi: 3.0.3
info:
  title: Smart Market API
  version: 1.0.0
  description: |
    Backend API cho **Smart Market – Chợ thông minh** (Zalo Mini App + CMS).

    ## Xác thực
    - **Mini app**: `POST /auth/zalo-login` với access token Zalo. Môi trường dev bật `ZALO_MOCK=true`
      cho phép token dạng `mock:<zaloId>:<Tên>` (vd `mock:zalo-buyer-1:Người Mua`).
    - **CMS**: `POST /auth/login` với username/email/số điện thoại + mật khẩu.
    - Sau khi đăng nhập, bấm **Authorize** và dán `accessToken` (không cần chữ "Bearer").

    ## Vai trò & phạm vi
    | Role | Phạm vi |
    |---|---|
    | super_admin | Toàn hệ thống |
    | province_admin | Các chợ trong tỉnh được gán (chủ yếu chỉ đọc + escalate phản ánh) |
    | market_manager | CRUD trong các chợ được gán |
    | user | Người mua; nếu `merchant_status=active` và có sạp → dùng được nhóm `/seller/*` |

    ## Quy ước
    - Envelope: `{ success, data, meta? }` hoặc `{ success: false, error: { code, message, details? } }`.
    - Phân trang: `?page=1&limit=20` (limit tối đa 100) → `meta { page, limit, total, totalPages }`.
    - Tiền VND số nguyên. Thời gian ISO 8601. Key JSON camelCase.
    - Tài khoản demo (seed): SA `admin@smartmarket.vn / Admin@12345`; MM `mm.trungtam@smartmarket.vn / Manager@123`.
servers:
  - url: http://localhost:3000/api/v1
    description: Local dev
tags:
  - name: Auth
  - name: Profile
  - name: Catalog
    description: Tỉnh/thành, ngành hàng, cấu hình public
  - name: Markets (App)
  - name: Stalls (App)
  - name: Products (App)
  - name: Orders (Buyer)
  - name: Reviews
  - name: Complaints (App)
  - name: Merchant Application (App)
  - name: Notifications (App)
  - name: Uploads
  - name: Seller
  - name: Admin - Dashboard
  - name: Admin - Markets
  - name: Admin - Zones & Stalls
  - name: Admin - Contracts
  - name: Admin - Merchant Approvals
  - name: Admin - Traders
  - name: Admin - Products
  - name: Admin - Orders
  - name: Admin - Complaints
  - name: Admin - Notifications
  - name: Admin - Reports
  - name: Admin - Exports
  - name: Admin - Settings & Users
  - name: Admin - Audits & Jobs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Search:
      name: search
      in: query
      schema: { type: string }
    MarketIdQuery:
      name: marketId
      in: query
      schema: { type: string, format: uuid }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: STATE_INVALID }
            message: { type: string, example: Đơn đang ở trạng thái "completed", không thể chuyển sang "confirmed" }
            details: { nullable: true }
    Image:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    ProductTraceabilityInput:
      type: object
      required: [producerName]
      properties:
        producerName: { type: string, maxLength: 255, description: Đơn vị sản xuất hoặc cung cấp }
        productionAddress: { type: string, nullable: true, description: Địa chỉ hoặc vùng sản xuất }
        batchCode: { type: string, maxLength: 100, nullable: true }
        productionDate: { type: string, format: date, nullable: true }
        harvestDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        certificateName: { type: string, maxLength: 255, nullable: true }
        certificateNumber: { type: string, maxLength: 100, nullable: true }
        documents:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/Image' }
        externalUrl: { type: string, format: uri, nullable: true }
        notes: { type: string, maxLength: 5000, nullable: true }
    OrderStatus:
      type: string
      enum: [pending, confirmed, preparing, ready, completed, cancelled]
    ApplicationStatus:
      type: string
      enum: [pending, reviewing, need_more_info, approved, rejected, cancelled]
    ComplaintStatus:
      type: string
      enum: [new, processing, resolved, rejected, escalated]
    ComplaintType:
      type: string
      enum: [product_quality, price_issue, food_safety, service_attitude, weighing_fraud, infrastructure, order_issue, other]
    StallStatus:
      type: string
      enum: [vacant, occupied, maintenance, reserved]
    DisplayStatus:
      type: string
      enum: [vacant, occupied, maintenance, reserved, expiring_soon, has_complaint]
      description: Trạng thái hiển thị (suy ra) — has_complaint > expiring_soon > trạng thái gốc
    NotificationTarget:
      type: string
      enum: [market, zone, category, user]
  responses:
    Ok:
      description: Thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data: {}
    Paginated:
      description: Danh sách có phân trang
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data: { type: array, items: {} }
              meta:
                type: object
                properties:
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 20 }
                  total: { type: integer, example: 135 }
                  totalPages: { type: integer, example: 7 }
    Err:
      description: Lỗi (400/401/403/404/409/429 — xem `error.code`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security: []

paths:
  # ================= AUTH =================
  /auth/zalo-login:
    post:
      tags: [Auth]
      summary: Đăng nhập/đăng ký bằng Zalo (mini app)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken: { type: string, example: 'mock:zalo-buyer-1:Người Mua Số Một' }
                userInfo:
                  type: object
                  description: Thông tin chỉ gửi khi scope.userInfo đã được người dùng cấp; backend đối chiếu id với access token.
                  required: [id]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    avatar: { type: string, format: uri }
      responses:
        '200':
          description: Token + hồ sơ phiên
          content:
            application/json:
              example:
                success: true
                data:
                  accessToken: eyJhbGciOi...
                  refreshToken: eyJhbGciOi...
                  user: { id: '...', fullName: Người Mua Số Một, role: user }
                  isMerchant: false
                  merchantApplication: null
                  seller: null
                  selectedMarket: { id: '...', name: Chợ Trung Tâm (Demo) }
        default: { $ref: '#/components/responses/Err' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập CMS (email/phone + mật khẩu)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, example: admin }
                password: { type: string, example: Admin@12345 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Cấp lại cặp token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Thông tin phiên hiện tại (app trả seller/selectedMarket, CMS trả scope)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /auth/change-password:
    put:
      tags: [Auth]
      summary: Đổi mật khẩu (role CMS)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }

  # ================= PROFILE =================
  /users/me:
    put:
      tags: [Profile]
      summary: Cập nhật hồ sơ cá nhân (tên, avatar, giới tính, thông tin ngân hàng)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                avatar: { type: string, format: uri }
                gender: { type: integer, enum: [0, 1, 2] }
                bankName: { type: string }
                bankCode: { type: string }
                bankAccountNumber: { type: string }
                bankAccountHolder: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /users/me/zalo-phone:
    post:
      tags: [Profile]
      summary: Đồng bộ thông tin cá nhân và số điện thoại Zalo
      description: Trên Zalo H5, ứng dụng xin đồng thời `scope.userInfo` và `scope.userPhonenumber`, sau đó gửi `userInfo`, `phoneToken` và `accessToken`. `mockPhone` chỉ được backend chấp nhận khi ZALO_MOCK=true.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneToken: { type: string }
                accessToken: { type: string }
                mockPhone: { type: string, example: '0912345678' }
                userInfo:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    avatar: { type: string, format: uri }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /users/me/selected-market:
    put:
      tags: [Profile]
      summary: Lưu chợ đang chọn
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marketId]
              properties:
                marketId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }

  # ================= CATALOG =================
  /provinces:
    get:
      tags: [Catalog]
      summary: Danh sách tỉnh/thành (public)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /categories:
    get:
      tags: [Catalog]
      summary: Danh sách ngành hàng (public)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /settings/public:
    get:
      tags: [Catalog]
      summary: Cấu hình public (đơn vị bán, thời hạn hợp đồng mặc định)
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ================= MARKETS (APP) =================
  /markets/nearby:
    post:
      tags: [Markets (App)]
      summary: Tìm chợ gần nhất theo tọa độ (browser/dev)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, example: 10.776 }
                longitude: { type: number, example: 106.7 }
                limit: { type: integer, default: 10 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /markets/nearby/zalo:
    post:
      tags: [Markets (App)]
      summary: Tìm chợ gần nhất bằng token vị trí ZMP
      description: Backend xác thực access token thuộc đúng tài khoản đăng nhập rồi giải mã locationToken qua Zalo Graph API.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationToken, accessToken]
              properties:
                locationToken: { type: string }
                accessToken: { type: string }
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /markets:
    get:
      tags: [Markets (App)]
      summary: Danh sách chợ đang hoạt động
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provinceId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /markets/{id}:
    get:
      tags: [Markets (App)]
      summary: Chi tiết chợ + thống kê + mapLink (sơ đồ)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /markets/{id}/traders:
    get:
      tags: [Markets (App)]
      summary: Danh sách tiểu thương/sạp đang kinh doanh trong chợ
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: zoneId, in: query, schema: { type: string, format: uuid } }
        - { name: hasPromotion, in: query, schema: { type: boolean } }
        - { name: minRating, in: query, schema: { type: number } }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /markets/{id}/home:
    get:
      tags: [Markets (App)]
      summary: Dữ liệu trang chủ theo chợ (nổi bật + đang giảm giá)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ================= STALLS (APP) =================
  /stalls/{id}:
    get:
      tags: [Stalls (App)]
      summary: Chi tiết sạp/tiểu thương (public app)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }

  # ================= PRODUCTS (APP) =================
  /products:
    get:
      tags: [Products (App)]
      summary: Danh sách sản phẩm theo chợ (kèm finalPrice, stockStatus, hasTraceability)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: marketId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: stallId, in: query, schema: { type: string, format: uuid } }
        - { name: onSale, in: query, schema: { type: boolean } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [price, rating, newest] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /products/{id}:
    get:
      tags: [Products (App)]
      summary: Chi tiết sản phẩm + hồ sơ truy xuất tự khai báo + tiểu thương + sản phẩm liên quan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /products/{id}/reviews:
    get:
      tags: [Products (App)]
      summary: Đánh giá của sản phẩm
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }

  # ================= ORDERS (BUYER) =================
  /orders:
    post:
      tags: [Orders (Buyer)]
      summary: Checkout — tách đơn theo sạp, nhóm bằng checkoutGroupId
      description: |
        Giỏ hàng ở client. `expectedUnitPrice` = finalPrice client đang thấy —
        lệch giá server trả `409 PRICE_CHANGED` kèm giá mới. Thiếu kho → `409 STOCK_NOT_ENOUGH`.
        MVP chỉ hỗ trợ `receiveType=pickup`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marketId, receiverName, receiverPhone, items]
              properties:
                marketId: { type: string, format: uuid }
                receiveType: { type: string, enum: [pickup, delivery], default: pickup }
                receiverName: { type: string }
                receiverPhone: { type: string, example: '0922000001' }
                note: { type: string, nullable: true }
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [productId, quantity, expectedUnitPrice]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: number, example: 2 }
                      expectedUnitPrice: { type: integer, example: 22500 }
      responses:
        '201':
          description: Danh sách đơn đã tạo
          content:
            application/json:
              example:
                success: true
                data:
                  checkoutGroupId: 5f3c...
                  orders: [{ id: '...', code: SM260711-X7K2P, totalAmount: 55000, status: pending }]
        default: { $ref: '#/components/responses/Err' }
    get:
      tags: [Orders (Buyer)]
      summary: Đơn hàng của tôi
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /orders/{id}:
    get:
      tags: [Orders (Buyer)]
      summary: Chi tiết đơn (kèm items, timeline)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /orders/{id}/cancel:
    post:
      tags: [Orders (Buyer)]
      summary: Buyer hủy đơn (khi pending/confirmed) — tự hoàn kho
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }

  # ================= REVIEWS =================
  /reviews:
    post:
      tags: [Reviews]
      summary: Đánh giá sản phẩm (mỗi người 1 đánh giá/SP, yêu cầu đã mua)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, rating]
              properties:
                productId: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string, nullable: true }
                images: { type: array, items: { $ref: '#/components/schemas/Image' } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /reviews/{id}:
    put:
      tags: [Reviews]
      summary: Sửa đánh giá của mình
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string }
                images: { type: array, items: { $ref: '#/components/schemas/Image' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
    delete:
      tags: [Reviews]
      summary: Xóa đánh giá của mình
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /my/reviews:
    get:
      tags: [Reviews]
      summary: Đánh giá của tôi
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }

  # ================= COMPLAINTS (APP) =================
  /complaints:
    post:
      tags: [Complaints (App)]
      summary: Gửi phản ánh/khiếu nại (gắn chợ, sạp/sản phẩm nếu có)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marketId, type, content]
              properties:
                marketId: { type: string, format: uuid }
                stallId: { type: string, format: uuid, nullable: true }
                productId: { type: string, format: uuid, nullable: true }
                type: { $ref: '#/components/schemas/ComplaintType' }
                content: { type: string }
                images: { type: array, items: { $ref: '#/components/schemas/Image' } }
      responses:
